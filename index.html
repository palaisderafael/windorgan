<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wind Organ — Oakland / 99 Bowery, NY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Josefin Sans', 'Futura', 'Century Gothic', sans-serif;
      color: #000000;
      min-height: 100vh;
      background-size: contain;
      background-position: center top;
      background-repeat: no-repeat;
      background-color: #ffffff;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 40px;
    }

    .inner {
      width: 100%;
      max-width: 420px;
    }

    .corner-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 100px;
      z-index: 10;
    }

    .corner-btn img {
      width: 100%;
      height: auto;
      display: block;
      filter: blur(2px);
      opacity: 0.7;
      transition: filter 0.25s ease, opacity 0.25s ease;
    }

    .corner-btn:hover img,
    .corner-btn:active img,
    .corner-btn:focus img {
      filter: blur(0);
      opacity: 1;
    }

    .mobile-corner-btn {
      display: none;
    }

    .title {
      font-size: 16px;
      font-weight: normal;
      line-height: 1.6;
      margin-bottom: 32px;
      text-shadow: 0 1px 4px rgba(255,255,255,0.9);
    }

    .player {
      border: 1px solid #000000;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.60);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .play-btn {
      width: 40px;
      height: 40px;
      min-width: 40px;
      background-color: #000000;
      border: none;
      border-radius: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn:hover { background-color: #333333; }

    .triangle {
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 7px 0 7px 13px;
      border-color: transparent transparent transparent #ffffff;
      margin-left: 3px;
    }

    .pause { display: none; gap: 3px; }
    .pause-bar { width: 4px; height: 14px; background: #ffffff; }

    .info { display: flex; flex-direction: column; gap: 4px; }

    .location, .time, .status, .weather {
      font-size: 13px;
      color: #000000;
    }

    .bottom-row {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .image-nav {
      display: flex;
      gap: 8px;
    }

    .image-nav-btn {
      width: 32px;
      height: 32px;
      background-color: #000000;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-nav-btn:hover {
      background-color: #333333;
    }

    .vhs-arrow-pair {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .vhs-arrow {
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
    }

    .vhs-arrow.back {
      border-right: 8px solid #ffffff;
    }

    .vhs-arrow.forward {
      border-left: 8px solid #ffffff;
    }

    .more {
      margin-top: 24px;
      font-size: 14px;
      line-height: 1.6;
      text-shadow: 0 1px 4px rgba(255,255,255,0.9);
    }

    .more a {
      color: #000000;
      text-decoration: none;
      border-bottom: 1px solid #000000;
    }

    .more a:hover { border-bottom-color: transparent; }
    .more a:focus-visible { outline: 2px solid #000000; outline-offset: 3px; }

    .corner-btn { text-decoration: none; color: #000000; }

    .corner-label {
      display: block;
      margin: 6px -24px 0;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
      white-space: nowrap;
      color: #000000;
      text-shadow: 0 1px 4px rgba(255,255,255,0.9);
      opacity: 0.7;
      transition: opacity 0.25s ease;
    }

    .corner-btn:hover .corner-label,
    .corner-btn:active .corner-label,
    .corner-btn:focus .corner-label { opacity: 1; }

    @media (max-width: 480px) {
      .page { padding: 40px 24px; }
      .title { font-size: 15px; }

      .inner {
        display: flex;
        flex-direction: column;
      }

      .title { order: 1; }
      .player { order: 2; }
      .bottom-row { order: 3; }
      .mobile-corner-btn { order: 4; }
      .more { order: 5; }

      a.corner-btn:not(.mobile-corner-btn) {
        display: none;
      }

      .mobile-corner-btn {
        display: block;
        position: static;
        width: 60px;
        flex-shrink: 0;
        margin-top: 24px;
      }

      .mobile-corner-btn .corner-label { margin: 6px 0 0; text-align: left; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="inner">
      <a href="london.html" class="corner-btn">
        <img src="uk-button-copy.png" alt="listen to London">
        <span class="corner-label">Wind Organ London</span>
      </a>

      <div class="title">Wind Organ<br>Oakland, CA / 99 Bowery, NY</div>

      <div class="player">
        <button class="play-btn" onclick="toggle()" aria-label="Play stream">
          <div class="triangle" id="triangle"></div>
          <div class="pause" id="pause">
            <div class="pause-bar"></div>
            <div class="pause-bar"></div>
          </div>
        </button>
        <div class="info">
          <span class="location">99 Bowery, New York</span>
          <span class="time" id="clock"></span>
          <span class="weather" id="weather"></span>
          <span class="status" id="status">press play to listen</span>
        </div>
      </div>

      <div class="bottom-row">
        <div class="image-nav">
          <button class="image-nav-btn" onclick="prevImage()" aria-label="previous image">
            <div class="vhs-arrow-pair">
              <div class="vhs-arrow back"></div>
              <div class="vhs-arrow back"></div>
            </div>
          </button>
          <button class="image-nav-btn" onclick="nextImage()" aria-label="next image">
            <div class="vhs-arrow-pair">
              <div class="vhs-arrow forward"></div>
              <div class="vhs-arrow forward"></div>
            </div>
          </button>
        </div>
      </div>

      <a href="london.html" class="corner-btn mobile-corner-btn">
        <img src="uk-button-copy.png" alt="listen to London">
        <span class="corner-label">Wind Organ London</span>
      </a>

      <div class="more"><a href="voices.html">Voices</a> &nbsp;·&nbsp; <a href="drawings.html">Drawings</a> &nbsp;·&nbsp; <a href="guestbook.html">Guestbook</a></div>
    </div>
  </div>

  <audio id="audio" src="https://radio.shoutcheap.com/proxy/rafael/stream" preload="none"></audio>

  <script>
    const images = [
      'flying.jpg', 'nyc.jpg', 'IMG_8740.jpg', 'IMG_8786.jpg', 'IMG_9011.jpg', 'IMG_9031.jpg', 'IMG_9950.jpg',
      'IMG_0254.jpg', 'IMG_0261.jpg', 'IMG_0266.jpg', 'IMG_0269.jpg', 'IMG_0271.jpg', 'IMG_0273.jpg', 'IMG_0274.jpg', 'IMG_0275.jpg', 'IMG_0278.jpg', 'IMG_0282.jpg', 'IMG_0286.jpg', 'IMG_0287.jpg', 'IMG_0288.jpg', 'IMG_0289.jpg', 'IMG_0290.jpg', 'IMG_0291.jpg', 'IMG_0293.jpg', 'IMG_0294.jpg', 'IMG_0296.jpg', 'IMG_0302.jpg', 'IMG_0304.jpg', 'IMG_0305.jpg', 'IMG_0307.jpg'
    ];
    let imageIndex = Math.floor(Math.random() * images.length);

    function setBackground(index) {
      document.body.style.backgroundImage = 'url(' + images[index] + ')';
    }
    setBackground(imageIndex);

    function nextImage() {
      imageIndex = (imageIndex + 1) % images.length;
      setBackground(imageIndex);
    }

    function prevImage() {
      imageIndex = (imageIndex - 1 + images.length) % images.length;
      setBackground(imageIndex);
    }

    let playing = false;
    const audio = document.getElementById('audio');
    const triangle = document.getElementById('triangle');
    const pause = document.getElementById('pause');
    const status = document.getElementById('status');
    const clock = document.getElementById('clock');

    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString('en-US', {
        timeZone: 'America/New_York',
        hour: '2-digit', minute: '2-digit', hour12: false,
        timeZoneName: 'short'
      });
      clock.textContent = time;
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* weather at 99 Bowery: free Open-Meteo service, no key. Shows nothing if it can't be reached. */
    const WMO = {0:'clear',1:'mostly clear',2:'partly cloudy',3:'overcast',45:'fog',48:'fog',
      51:'light drizzle',53:'drizzle',55:'heavy drizzle',56:'freezing drizzle',57:'freezing drizzle',
      61:'light rain',63:'rain',65:'heavy rain',66:'freezing rain',67:'freezing rain',
      71:'light snow',73:'snow',75:'heavy snow',77:'snow grains',80:'light showers',81:'showers',82:'heavy showers',
      85:'snow showers',86:'snow showers',95:'thunderstorm',96:'thunderstorm',99:'thunderstorm'};
    const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
    const weatherEl = document.getElementById('weather');
    function updateWeather() {
      const url = 'https://api.open-meteo.com/v1/forecast?latitude=40.719&longitude=-73.996'
        + '&current=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code'
        + '&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FNew_York';
      fetch(url).then(r => r.json()).then(d => {
        const c = d.current;
        const dir = COMPASS[Math.round(c.wind_direction_10m / 22.5) % 16];
        const sky = WMO[c.weather_code] || '';
        weatherEl.textContent = Math.round(c.temperature_2m) + '°F · wind ' + Math.round(c.wind_speed_10m) + ' mph ' + dir + (sky ? ' · ' + sky : '');
      }).catch(() => { weatherEl.textContent = ''; });
    }
    updateWeather();
    setInterval(updateWeather, 10 * 60 * 1000);

    function toggle() {
      if (!playing) {
        audio.play();
        playing = true;
        triangle.style.display = 'none';
        pause.style.display = 'flex';
        status.textContent = 'live — wind organ';
      } else {
        audio.pause();
        playing = false;
        triangle.style.display = 'block';
        pause.style.display = 'none';
        status.textContent = 'press play to listen';
      }
    }
  </script>
</body>
</html>
