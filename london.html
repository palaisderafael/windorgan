<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wind Organ — London</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      font-family: 'Josefin Sans', 'Futura', 'Century Gothic', sans-serif;
      color: #000000;
      min-height: 100vh;
      background-size: contain;
      background-position: center top;
      background-repeat: no-repeat;
      background-color: #ffffff;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 40px;
    }

    .inner {
      width: 100%;
      max-width: 420px;
    }

    .corner-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 100px;
      z-index: 10;
    }

    .corner-btn img {
      width: 100%;
      height: auto;
      display: block;
      filter: blur(2px);
      opacity: 0.7;
      transition: filter 0.25s ease, opacity 0.25s ease;
    }

    .corner-btn:hover img,
    .corner-btn:active img,
    .corner-btn:focus img {
      filter: blur(0);
      opacity: 1;
    }

    .title {
      font-size: 16px;
      font-weight: normal;
      line-height: 1.6;
      margin-bottom: 32px;
      text-shadow: 0 1px 4px rgba(255,255,255,0.9);
    }

    .player {
      border: 1px solid #000000;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.60);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .play-btn {
      width: 40px;
      height: 40px;
      min-width: 40px;
      background-color: #B23A3A;
      border: none;
      border-radius: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn:hover { background-color: #9A2F2F; }

    .triangle {
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 7px 0 7px 13px;
      border-color: transparent transparent transparent #ffffff;
      margin-left: 3px;
    }

    .pause { display: none; gap: 3px; }
    .pause-bar { width: 4px; height: 14px; background: #ffffff; }

    .info { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }

    .location, .time, .status, .elapsed {
      font-size: 13px;
      color: #000000;
    }

    .status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .bar {
      height: 8px;
      border: 1px solid #000000;
      margin: 4px 0 2px;
      cursor: pointer;
    }
    .bar-fill { height: 100%; width: 0; background: #B23A3A; }

    .bottom-row {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .mobile-corner-btn {
      display: none;
    }

    .image-nav {
      display: flex;
      gap: 8px;
    }

    .image-nav-btn {
      width: 32px;
      height: 32px;
      background-color: #B23A3A;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-nav-btn:hover {
      background-color: #9A2F2F;
        }

    .vhs-arrow-pair {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .vhs-arrow {
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
    }

    .vhs-arrow.back {
      border-right: 8px solid #ffffff;
    }

    .vhs-arrow.forward {
      border-left: 8px solid #ffffff;
    }

    /* ---- Past days ---- */
    .days { margin-top: 40px; }

    .days-caption, .month {
      font-size: 13px;
      margin: 0 0 8px;
      text-shadow: 0 1px 4px rgba(255,255,255,0.9);
    }
    .month { margin-top: 20px; }

    .day {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      width: 100%;
      padding: 10px 12px;
      font: inherit;
      font-size: 13px;
      color: #000000;
      text-align: left;
      background: rgba(255, 255, 255, 0.60);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid #000000;
      margin-top: -1px;
      cursor: pointer;
    }
    .day:first-of-type { margin-top: 0; }
    .day:hover { background: rgba(255, 255, 255, 0.85); }
    .day.active { border-left: 6px solid #B23A3A; padding-left: 7px; }
    .day .meta { white-space: nowrap; }
    .play-btn:focus-visible, .day:focus-visible, .bar:focus-visible { outline: 2px solid #000; outline-offset: 2px; }

    @media (max-width: 480px) {
      .page { padding: 40px 24px; }
      .title { font-size: 15px; }

      .inner {
        display: flex;
        flex-direction: column;
      }

      .title { order: 1; }
      .player { order: 2; }
      .bottom-row { order: 3; }
      .days { order: 4; }

      .day { flex-direction: column; gap: 2px; }

      a.corner-btn:not(.mobile-corner-btn) {
        display: none;
      }

      .mobile-corner-btn {
        display: block;
        position: static;
        width: 60px;
        flex-shrink: 0;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="inner">
      <a href="index.html" class="corner-btn">
        <img src="99-button-copy.png" alt="listen to Oakland / NYC">
      </a>

      <div class="title">Wind Organ<br>London</div>

      <div class="player">
        <button class="play-btn" onclick="toggle()" aria-label="Play stream">
          <div class="triangle" id="triangle"></div>
          <div class="pause" id="pause">
            <div class="pause-bar"></div>
            <div class="pause-bar"></div>
          </div>
        </button>
        <div class="info">
          <span class="location">Serpentine South Gallery</span>
          <span class="time" id="clock"></span>
          <span class="status" id="status">press play to listen</span>
          <div class="bar" id="bar" hidden aria-label="Seek"><div class="bar-fill" id="fill"></div></div>
          <span class="elapsed" id="elapsed" hidden>0:00 / 0:00</span>
        </div>
      </div>

      <div class="bottom-row">
        <div class="image-nav">
          <button class="image-nav-btn" onclick="prevImage()" aria-label="previous image">
            <div class="vhs-arrow-pair">
              <div class="vhs-arrow back"></div>
              <div class="vhs-arrow back"></div>
            </div>
          </button>
          <button class="image-nav-btn" onclick="nextImage()" aria-label="next image">
            <div class="vhs-arrow-pair">
              <div class="vhs-arrow forward"></div>
              <div class="vhs-arrow forward"></div>
            </div>
          </button>
        </div>
        <a href="index.html" class="corner-btn mobile-corner-btn">
          <img src="99-button-copy.png" alt="listen to Oakland / NYC">
        </a>
      </div>

      <!-- Filled in from sessions.json. Stays hidden if that file is missing. -->
      <div class="days" id="days" hidden></div>
    </div>
  </div>

  <audio id="audio" preload="none"></audio>

  <script>
    const images = ['london1.jpeg', 'london2.jpeg', 'london4.jpeg', 'london5.JPEG', 'london6.jpeg', 'london7.jpeg', 'london8.jpeg',
      'london9.jpg', 'london10.jpg', 'london11.jpg', 'london12.jpg', 'london13.jpg', 'london14.jpg', 'london15.jpg', 'london16.jpg', 'london17.jpg', 'london18.jpg', 'london19.jpg', 'london20.jpg', 'london21.jpg', 'london22.jpg', 'london23.jpg', 'london24.jpg', 'london25.jpg', 'london26.jpg', 'london27.jpg', 'london28.jpg', 'london29.jpg', 'london30.jpg', 'london31.jpg', 'london32.jpg', 'london33.jpg', 'london34.jpg', 'london35.jpg', 'london36.jpg', 'london37.jpg', 'london38.jpg', 'london39.jpg', 'london40.jpg', 'london41.jpg', 'london42.jpg', 'london43.jpg', 'london44.jpg', 'london45.jpg', 'london46.jpg', 'london47.jpg', 'london48.jpg', 'london49.jpg', 'london50.jpg', 'london51.jpg'];
    let imageIndex = Math.floor(Math.random() * images.length);

    function setBackground(index) {
      document.body.style.backgroundImage = 'url(' + images[index] + ')';
    }
    setBackground(imageIndex);

    function nextImage() {
      imageIndex = (imageIndex + 1) % images.length;
      setBackground(imageIndex);
    }

    function prevImage() {
      imageIndex = (imageIndex - 1 + images.length) % images.length;
      setBackground(imageIndex);
    }

    const LIVE_URL = 'https://radio.shoutcheap.com/proxy/rafael12/live';
    const audio = document.getElementById('audio');
    const triangle = document.getElementById('triangle');
    const pause = document.getElementById('pause');
    const status = document.getElementById('status');
    const clock = document.getElementById('clock');
    const bar = document.getElementById('bar');
    const fill = document.getElementById('fill');
    const elapsed = document.getElementById('elapsed');
    const daysEl = document.getElementById('days');

    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString('en-US', {
        timeZone: 'Europe/London',
        hour: '2-digit', minute: '2-digit', hour12: false
      });
      const offsetPart = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Europe/London',
        timeZoneName: 'shortOffset'
      }).formatToParts(now).find(part => part.type === 'timeZoneName').value;
      const label = offsetPart.includes('+1') ? 'BST' : 'GMT';
      clock.textContent = time + ' ' + label;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ---- Player: the live stream, or one of the past days ----
    let mode = 'idle';      // 'idle', 'live' or 'archive'
    let days = [];          // one entry per day, from sessions.json
    let tracks = [];        // playlist: one entry per audio file, in order
    let current = -1;       // index into tracks while mode is 'archive'
    let rows = [];          // one button per day
    let liveRow = null;

    function fmtTime(s) {
      if (!isFinite(s)) return '0:00';
      s = Math.floor(s);
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      const mm = h ? String(m).padStart(2, '0') : String(m);
      return (h ? h + ':' : '') + mm + ':' + String(sec).padStart(2, '0');
    }

    function parseDay(str) {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    function dayLabel(str) {
      return parseDay(str).toLocaleDateString('en-GB',
        { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    }
    function monthLabel(str) {
      return parseDay(str).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    }
    function trackLabel(t) {
      const base = dayLabel(days[t.day].date);
      return t.of > 1 ? base + ' · part ' + (t.part + 1) + ' of ' + t.of : base;
    }

    function updateButton() {
      const isPlaying = !audio.paused;
      triangle.style.display = isPlaying ? 'none' : 'block';
      pause.style.display = isPlaying ? 'flex' : 'none';
    }

    function showArchiveControls(show) {
      bar.hidden = !show;
      elapsed.hidden = !show;
      if (!show) fill.style.width = '0%';
    }

    function markActive() {
      if (liveRow) liveRow.classList.toggle('active', mode === 'live');
      const activeDay = mode === 'archive' && current >= 0 ? tracks[current].day : -1;
      rows.forEach((r, i) => r && r.classList.toggle('active', i === activeDay));
    }

    function goLive() {
      mode = 'live';
      current = -1;
      audio.src = LIVE_URL;               // a fresh connection, so it plays what is on now
      showArchiveControls(false);
      status.textContent = 'connecting…';
      markActive();
      audio.play().catch(() => { status.textContent = 'press play to listen'; });
    }

    function playTrack(i) {
      if (i < 0 || i >= tracks.length) return;
      mode = 'archive';
      current = i;
      audio.src = tracks[i].file;         // this also drops the live connection
      showArchiveControls(true);
      elapsed.textContent = '0:00 / 0:00';
      status.textContent = 'loading…';
      markActive();
      audio.play().catch(() => { status.textContent = 'press play to start'; });
    }

    function playDay(dayIndex) {
      playTrack(tracks.findIndex((t) => t.day === dayIndex));
    }

    function toggle() {
      if (mode === 'idle' || (mode === 'live' && audio.paused)) { goLive(); return; }
      if (audio.paused) audio.play(); else audio.pause();
    }

    audio.addEventListener('play', updateButton);
    audio.addEventListener('pause', () => {
      updateButton();
      if (!audio.ended) status.textContent = mode === 'archive' ? 'paused' : 'press play to listen';
    });
    audio.addEventListener('playing', () => {
      status.textContent = mode === 'archive' && current >= 0 ? trackLabel(tracks[current]) : 'live — wind organ';
    });
    audio.addEventListener('waiting', () => { status.textContent = 'loading…'; });
    audio.addEventListener('error', () => {
      updateButton();
      status.textContent = mode === 'archive' ? 'could not load this one' : 'could not connect — press play to retry';
    });
    audio.addEventListener('timeupdate', () => {
      if (mode !== 'archive') return;
      const dur = audio.duration;
      elapsed.textContent = fmtTime(audio.currentTime) + ' / ' + fmtTime(dur);
      fill.style.width = (isFinite(dur) && dur > 0 ? (audio.currentTime / dur) * 100 : 0) + '%';
    });
    audio.addEventListener('ended', () => {
      updateButton();
      if (mode === 'archive') {
        if (current + 1 < tracks.length) playTrack(current + 1);
        else status.textContent = 'end of the days';
      } else {
        status.textContent = 'press play to listen';
      }
    });

    bar.addEventListener('click', (e) => {
      if (mode !== 'archive' || !isFinite(audio.duration) || audio.duration <= 0) return;
      const r = bar.getBoundingClientRect();
      audio.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * audio.duration;
    });

    // ---- Past days list ----
    function buildTracks() {
      tracks = [];
      days.forEach((d, di) => {
        const parts = d.parts && d.parts.length ? d.parts : [{ file: d.file }];
        parts.forEach((p, pi) => tracks.push({ day: di, part: pi, of: parts.length, file: p.file }));
      });
    }

    function makeRow(labelText, metaText, onClick) {
      const b = document.createElement('button');
      b.className = 'day';
      const label = document.createElement('span');
      label.textContent = labelText;
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = metaText;
      b.append(label, meta);
      b.addEventListener('click', onClick);
      return b;
    }

    function renderDays() {
      daysEl.textContent = '';
      rows = [];
      if (!days.length) { daysEl.hidden = true; return; }

      liveRow = makeRow('Live now', 'as it happens', goLive);
      daysEl.appendChild(liveRow);

      const caption = document.createElement('div');
      caption.className = 'days-caption';
      caption.style.marginTop = '24px';
      caption.textContent = 'Past days';
      daysEl.appendChild(caption);

      let lastMonth = '';
      days.forEach((d, i) => {
        const month = monthLabel(d.date);
        if (month !== lastMonth) {
          const h = document.createElement('div');
          h.className = 'month';
          if (lastMonth === '') h.style.marginTop = '0';
          h.textContent = month;
          daysEl.appendChild(h);
          lastMonth = month;
        }
        const mins = (x) => (x < 10 ? String(Math.round(x * 10) / 10) : String(Math.round(x)));
        const length = mins(d.excerpt_minutes || d.minutes) + ' min';
        const peak = d.peak != null ? ' · peak ' + d.peak + ' m/s' : '';   // leave out "peak" in sessions.json to hide it
        const row = makeRow(dayLabel(d.date), length + peak, () => playDay(i));
        daysEl.appendChild(row);
        rows[i] = row;
      });
      daysEl.hidden = false;
      markActive();
    }

    fetch('sessions.json', { cache: 'no-cache' })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((data) => { days = data.days || []; buildTracks(); renderDays(); })
      .catch(() => { daysEl.hidden = true; });    // no list: the page just stays a live player
  </script>
</body>
</html>
