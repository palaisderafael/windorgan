<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wind Organ — London</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Josefin Sans', 'Futura', 'Century Gothic', sans-serif;
      color: #000000;
      min-height: 100vh;
      background-size: contain;
      background-position: center top;
      background-repeat: no-repeat;
      background-color: #ffffff;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 40px;
    }

    .inner {
      width: 100%;
      max-width: 420px;
    }

    .corner-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 100px;
      z-index: 10;
    }

    .corner-btn img {
      width: 100%;
      height: auto;
      display: block;
      filter: blur(2px);
      opacity: 0.7;
      transition: filter 0.25s ease, opacity 0.25s ease;
    }

    .corner-btn:hover img,
    .corner-btn:active img,
    .corner-btn:focus img {
      filter: blur(0);
      opacity: 1;
    }

    .title {
      font-size: 16px;
      font-weight: normal;
      line-height: 1.6;
      margin-bottom: 32px;
      text-shadow: 0 1px 4px rgba(255,255,255,0.9);
    }

    .player {
      border: 1px solid #000000;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.60);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .play-btn {
      width: 40px;
      height: 40px;
      min-width: 40px;
      background-color: #B23A3A;
      border: none;
      border-radius: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn:hover { background-color: #9A2F2F; }

    .triangle {
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 7px 0 7px 13px;
      border-color: transparent transparent transparent #ffffff;
      margin-left: 3px;
    }

    .pause { display: none; gap: 3px; }
    .pause-bar { width: 4px; height: 14px; background: #ffffff; }

    .info { display: flex; flex-direction: column; gap: 4px; }

    .location, .time, .status {
      font-size: 13px;
      color: #000000;
    }

    .image-nav {
      margin-top: 16px;
      display: flex;
      gap: 8px;
    }

    .image-nav-btn {
      width: 32px;
      height: 32px;
      background-color: #B23A3A;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-nav-btn:hover {
      background-color: #9A2F2F;
        }

    .vhs-arrow-pair {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .vhs-arrow {
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
    }

    .vhs-arrow.back {
      border-right: 8px solid #ffffff;
    }

    .vhs-arrow.forward {
      border-left: 8px solid #ffffff;
    }

    @media (max-width: 480px) {
      .page { padding: 40px 24px; }
      .title { font-size: 15px; }

      .inner {
        display: flex;
        flex-direction: column;
      }

      .title { order: 1; }
      .player { order: 2; }
      .image-nav { order: 3; }

      .corner-btn {
        position: static;
        margin-top: 16px;
        width: 100px;
        order: 4;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="inner">
      <a href="index.html" class="corner-btn">
        <img src="99-button-copy.png" alt="listen to Oakland / NYC">
      </a>

      <div class="title">Wind Organ<br>London</div>

      <div class="player">
        <button class="play-btn" onclick="toggle()" aria-label="Play stream">
          <div class="triangle" id="triangle"></div>
          <div class="pause" id="pause">
            <div class="pause-bar"></div>
            <div class="pause-bar"></div>
          </div>
        </button>
        <div class="info">
          <span class="location">Serpentine South Gallery</span>
          <span class="time" id="clock"></span>
          <span class="status" id="status">press play to listen</span>
        </div>
      </div>

      <div class="image-nav">
        <button class="image-nav-btn" onclick="prevImage()" aria-label="previous image">
          <div class="vhs-arrow-pair">
            <div class="vhs-arrow back"></div>
            <div class="vhs-arrow back"></div>
          </div>
        </button>
        <button class="image-nav-btn" onclick="nextImage()" aria-label="next image">
          <div class="vhs-arrow-pair">
            <div class="vhs-arrow forward"></div>
            <div class="vhs-arrow forward"></div>
          </div>
        </button>
      </div>
    </div>
  </div>

  <audio id="audio" src="https://radio.shoutcheap.com/proxy/rafael12/live" preload="none"></audio>

  <script>
    const images = ['london1.jpeg', 'london2.jpeg', 'london4.jpeg', 'london5.JPEG', 'london6.jpeg', 'london7.jpeg', 'london8.jpeg'];
    let imageIndex = Math.floor(Math.random() * images.length);

    function setBackground(index) {
      document.body.style.backgroundImage = 'url(' + images[index] + ')';
    }
    setBackground(imageIndex);

    function nextImage() {
      imageIndex = (imageIndex + 1) % images.length;
      setBackground(imageIndex);
    }

    function prevImage() {
      imageIndex = (imageIndex - 1 + images.length) % images.length;
      setBackground(imageIndex);
    }

    let playing = false;
    const audio = document.getElementById('audio');
    const triangle = document.getElementById('triangle');
    const pause = document.getElementById('pause');
    const status = document.getElementById('status');
    const clock = document.getElementById('clock');

    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString('en-US', {
        timeZone: 'Europe/London',
        hour: '2-digit', minute: '2-digit', hour12: false
      });
      const offsetPart = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Europe/London',
        timeZoneName: 'shortOffset'
      }).formatToParts(now).find(part => part.type === 'timeZoneName').value;
      const label = offsetPart.includes('+1') ? 'BST' : 'GMT';
      clock.textContent = time + ' ' + label;
    }
    updateClock();
    setInterval(updateClock, 1000);

    function toggle() {
      if (!playing) {
        audio.play();
        playing = true;
        triangle.style.display = 'none';
        pause.style.display = 'flex';
        status.textContent = 'live — wind organ';
      } else {
        audio.pause();
        playing = false;
        triangle.style.display = 'block';
        pause.style.display = 'none';
        status.textContent = 'press play to listen';
      }
    }
  </script>
</body>
</html>
